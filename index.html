<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>24-Hour Trades — Free Live Training</title>

<style>
/* ─── tokens ──────────────────────────────────────────────────────────── */
:root {
  /* polished financial — light/white + gold */
  --bg-0: #ffffff;
  --bg-1: #faf9f5;
  --bg-2: #f3f1ea;
  --bg-card: #ffffff;
  --border: rgba(20, 16, 8, 0.09);
  --border-strong: rgba(20, 16, 8, 0.18);

  --text-0: #16110a;
  --text-1: #4f4a40;
  --text-2: #807a6e;
  --text-3: #b3ad9f;

  --gold: #1d4ed8;
  --gold-bright: #3b82f6;
  --gold-glow: rgba(37, 99, 235, 0.35);

  --green: #137a3a;
  --green-soft: #e7f5ec;
  --red: #c8341d;
  --red-soft: #fbeae6;

  --serif: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro", "Helvetica Neue", system-ui, sans-serif;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", "Helvetica Neue", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;

  --max: 1200px;
  --gutter: clamp(20px, 4vw, 40px);
}

/* ─── reset ───────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.5;
  color: var(--text-0);
  background: var(--bg-0);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}
button { font-family: inherit; cursor: pointer; }
img { max-width: 100%; display: block; }

/* ─── page chrome ─────────────────────────────────────────────────────── */
.page {
  min-height: 100vh;
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(37, 99, 235, 0.12), transparent 60%),
    radial-gradient(800px 400px at 100% 30%, rgba(37, 99, 235, 0.05), transparent 60%),
    var(--bg-0);
}

/* alert bar */
.alert-bar {
  background: linear-gradient(180deg, #1a1408 0%, #14110a 100%);
  border-bottom: 1px solid rgba(37, 99, 235, 0.32);
  color: #ffffff;
  font-size: clamp(17px, 1.7vw, 19px);
  letter-spacing: 0.10em;
  text-transform: uppercase;
  font-weight: 700;
  text-align: center;
  padding: 16px 20px;
  position: relative;
}
.alert-bar::before {
  content: none;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.85); }
}

/* ─── container ───────────────────────────────────────────────────────── */
.container {
  width: 100%;
  max-width: var(--max);
  margin: 0 auto;
  padding: 0 var(--gutter);
}

/* ─── hero ────────────────────────────────────────────────────────────── */
.hero {
  padding: clamp(28px, 5vw, 56px) 0 clamp(40px, 6vw, 72px);
  text-align: center;
  position: relative;
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 9px 18px 9px 16px;
  border: 1px solid rgba(229, 32, 18, 0.40);
  background: rgba(229, 32, 18, 0.10);
  color: #e22014;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  border-radius: 999px;
  margin-bottom: 22px;
}
.eyebrow .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: #e22014;
  box-shadow: 0 0 12px rgba(229, 32, 18, 0.65);
}

h1.headline {
  font-family: var(--serif);
  font-weight: 700;
  font-size: clamp(40px, 6vw, 60px);
  line-height: 1.18;
  letter-spacing: -0.03em;
  margin: 0 auto 18px;
  max-width: 22ch;
  color: var(--text-0);
  text-wrap: balance;
}
.headline em {
  font-style: italic;
  font-weight: 600;
  color: var(--gold);
  letter-spacing: -0.028em;
}
.headline .stack {
  display: block;
}

.subhead {
  max-width: 64ch;
  margin: 0 auto 28px;
  color: var(--text-1);
  font-size: clamp(18px, 1.6vw, 19px);
  line-height: 1.5;
  text-wrap: pretty;
  font-weight: 500;
}
.subhead strong { color: var(--text-0); font-weight: 700; }

/* claim chip row under subhead */
.chip-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin-bottom: 28px;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 11px;
  border: 1px solid var(--border);
  background: var(--bg-1);
  border-radius: 999px;
  font-size: 12px;
  color: var(--text-1);
  font-variant-numeric: tabular-nums;
}
.chip svg { opacity: 0.7; }
.chip b { color: var(--text-0); font-weight: 600; }

/* ─── countdown ───────────────────────────────────────────────────────── */
.countdown-wrap {
  margin: 0 auto 32px;
  max-width: 520px;
}
.countdown-label {
  font-size: 15px;
  letter-spacing: 0.20em;
  text-transform: uppercase;
  color: var(--text-1);
  font-weight: 700;
  margin-bottom: 14px;
}
.countdown {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}
.countdown .cell {
  background: linear-gradient(180deg, #ffffff 0%, var(--bg-1) 100%);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 6px 10px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 1px 2px rgba(20, 16, 8, 0.04);
}
.countdown .cell::before {
  content: "";
  position: absolute;
  inset: 0 0 50% 0;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.6), transparent);
  pointer-events: none;
}
.countdown .num {
  font-family: var(--mono);
  font-weight: 700;
  font-size: clamp(28px, 5vw, 42px);
  color: var(--text-0);
  letter-spacing: -0.02em;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.countdown .lbl {
  margin-top: 6px;
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-2);
  font-weight: 600;
}

/* ─── CTA ─────────────────────────────────────────────────────────────── */
.cta-stack {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}
.cta {
  appearance: none;
  border: 0;
  background: linear-gradient(180deg, var(--gold-bright) 0%, var(--gold) 100%);
  color: #ffffff;
  font-family: var(--sans);
  font-weight: 700;
  font-size: clamp(16px, 1.8vw, 18px);
  letter-spacing: 0.01em;
  padding: 18px 32px;
  border-radius: 12px;
  min-width: min(420px, 92vw);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.25),
    inset 0 -2px 0 rgba(0, 0, 0, 0.18),
    0 12px 30px -8px var(--gold-glow),
    0 0 0 1px rgba(29, 78, 216, 0.45);
  transition: transform 0.12s ease, box-shadow 0.2s ease, filter 0.2s ease;
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
.cta:hover {
  transform: translateY(-1px);
  filter: brightness(1.05);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.3),
    inset 0 -2px 0 rgba(0, 0, 0, 0.2),
    0 14px 40px -8px var(--gold-glow),
    0 0 0 1px rgba(37, 99, 235, 0.6);
}
.cta:active { transform: translateY(0); }
.cta .arrow { transition: transform 0.2s ease; }
.cta:hover .arrow { transform: translateX(3px); }

.cta-sub {
  font-size: 12px;
  color: var(--text-2);
  letter-spacing: 0.04em;
}
.cta-sub .check {
  color: var(--green);
  margin: 0 6px 0 0;
}

/* seat bar */
.seats {
  width: min(420px, 92vw);
  margin-top: 4px;
}
.seats-row {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--text-2);
  margin-bottom: 6px;
  letter-spacing: 0.04em;
  font-variant-numeric: tabular-nums;
}
.seats-row b { color: var(--gold); font-weight: 600; }
.seats-track {
  height: 6px;
  background: var(--bg-2);
  border-radius: 999px;
  overflow: hidden;
  border: 1px solid var(--border);
}
.seats-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--gold) 0%, var(--gold-bright) 100%);
  border-radius: 999px;
  position: relative;
  box-shadow: 0 0 10px var(--gold-glow);
  transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}
.seats-fill::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent 70%, rgba(255, 255, 255, 0.4) 100%);
  animation: shimmer 2.4s ease-in-out infinite;
}
@keyframes shimmer {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

/* ─── proof section ───────────────────────────────────────────────────── */
.proof {
  padding: clamp(40px, 6vw, 72px) 0;
  border-top: 1px solid var(--border);
  background: linear-gradient(180deg, transparent 0%, rgba(37, 99, 235, 0.04) 100%);
}
.proof-grid {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: clamp(24px, 4vw, 56px);
  align-items: center;
}
@media (max-width: 760px) {
  .proof-grid { grid-template-columns: 1fr; }
}
.proof-image {
  background: var(--bg-0);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  position: relative;
  box-shadow: 0 1px 2px rgba(20, 16, 8, 0.04), 0 10px 30px -10px rgba(20, 16, 8, 0.08);
}
.proof-caption {
  margin-top: 12px;
  font-size: 11px;
  color: var(--text-3);
  line-height: 1.5;
  font-style: italic;
}

.proof-copy h2 {
  font-family: var(--serif);
  font-weight: 600;
  font-size: clamp(30px, 4.2vw, 46px);
  line-height: 1.02;
  letter-spacing: -0.028em;
  margin: 0 0 16px;
  text-wrap: balance;
}
.proof-copy h2 em { font-style: italic; font-weight: 600; color: var(--gold); }
.proof-copy p {
  color: var(--text-1);
  font-size: 16px;
  line-height: 1.6;
  margin: 0 0 14px;
  max-width: 52ch;
}

/* big stat */
.stat-block {
  display: flex;
  gap: 20px;
  margin: 22px 0 8px;
  align-items: flex-end;
}
.stat {
  flex: 1;
}
.stat .v {
  font-family: var(--serif);
  font-size: clamp(36px, 4.8vw, 54px);
  font-weight: 600;
  line-height: 1;
  letter-spacing: -0.035em;
  color: var(--text-0);
  font-variant-numeric: tabular-nums;
}
.stat .v.gold { color: var(--gold); }
.stat .v.green { color: var(--green); }
.stat .l {
  margin-top: 6px;
  font-size: 11px;
  color: var(--text-2);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 600;
}

/* ─── discover section ───────────────────────────────────────────────── */
.discover {
  padding: clamp(40px, 6vw, 80px) 0;
  border-top: 1px solid var(--border);
}
.section-eyebrow {
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--gold);
  font-weight: 600;
  text-align: center;
  margin-bottom: 14px;
}
.section-title {
  font-family: var(--serif);
  font-weight: 600;
  font-size: clamp(30px, 4.8vw, 50px);
  line-height: 1.02;
  letter-spacing: -0.03em;
  text-align: center;
  margin: 0 auto 48px;
  max-width: 22ch;
  text-wrap: balance;
}
.section-title em { font-style: italic; font-weight: 600; color: var(--gold); }

.cards-3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}
@media (max-width: 760px) {
  .cards-3 { grid-template-columns: 1fr; }
}
.card {
  background: var(--bg-0);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 28px 24px;
  position: relative;
  box-shadow: 0 1px 2px rgba(20, 16, 8, 0.03);
}
.card-num {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 500;
  font-size: 14px;
  color: var(--gold);
  margin-bottom: 18px;
  letter-spacing: 0.04em;
}
.card-num::before {
  content: "";
  display: inline-block;
  width: 24px;
  height: 1px;
  background: var(--gold);
  vertical-align: middle;
  margin-right: 10px;
  opacity: 0.6;
}
.card h3 {
  font-family: var(--serif);
  font-weight: 600;
  font-size: 22px;
  line-height: 1.18;
  margin: 0 0 12px;
  letter-spacing: -0.022em;
}
.card p {
  color: var(--text-1);
  font-size: 14.5px;
  line-height: 1.6;
  margin: 0;
}

/* ─── presenter section ──────────────────────────────────────────────── */
.presenter {
  padding: clamp(40px, 6vw, 80px) 0;
  border-top: 1px solid var(--border);
  background: var(--bg-1);
}
.presenter-grid {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: clamp(24px, 4vw, 48px);
  align-items: start;
}
@media (max-width: 760px) {
  .presenter-grid { grid-template-columns: 1fr; }
}

.headshot {
  width: 180px;
  height: 220px;
  border-radius: 14px;
  background: linear-gradient(135deg, #f3f1ea 0%, #e6e2d6 100%);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-3);
  font-size: 11px;
  font-style: italic;
  position: relative;
  overflow: hidden;
}
.headshot::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 50% 35%, rgba(37, 99, 235, 0.22), transparent 55%);
}
.headshot-init {
  font-family: var(--serif);
  font-weight: 600;
  font-size: 64px;
  color: var(--text-2);
  position: relative;
  z-index: 1;
  font-style: normal;
  letter-spacing: -0.03em;
}

.presenter-copy h2 {
  font-family: var(--serif);
  font-weight: 600;
  font-size: clamp(30px, 4.2vw, 46px);
  margin: 0 0 8px;
  line-height: 1;
  letter-spacing: -0.035em;
}
.presenter-role {
  color: var(--gold);
  font-size: 13px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 600;
  margin-bottom: 20px;
}
.presenter-copy p {
  color: var(--text-1);
  font-size: 15.5px;
  line-height: 1.6;
  margin: 0 0 14px;
  max-width: 60ch;
}
.presenter-copy p strong { color: var(--text-0); font-weight: 600; }

.creds {
  display: flex;
  gap: 28px;
  flex-wrap: wrap;
  margin-top: 22px;
  padding-top: 22px;
  border-top: 1px solid var(--border);
}
.cred .v {
  font-family: var(--serif);
  font-weight: 600;
  font-size: 26px;
  line-height: 1;
  letter-spacing: -0.025em;
  color: var(--gold);
  font-variant-numeric: tabular-nums;
}
.cred .l {
  margin-top: 4px;
  font-size: 11px;
  color: var(--text-2);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 600;
}

/* ─── final CTA ──────────────────────────────────────────────────────── */
.final-cta {
  padding: clamp(40px, 6vw, 80px) 0;
  text-align: center;
  border-top: 1px solid var(--border);
}
.final-cta h2 {
  font-family: var(--serif);
  font-weight: 600;
  font-size: clamp(32px, 5.2vw, 58px);
  margin: 0 auto 16px;
  max-width: 20ch;
  line-height: 1.02;
  letter-spacing: -0.035em;
  text-wrap: balance;
}
.final-cta h2 em { font-style: italic; font-weight: 600; color: var(--gold); }
.final-cta p {
  color: var(--text-1);
  font-size: 16px;
  max-width: 50ch;
  margin: 0 auto 32px;
}

/* ─── footer ─────────────────────────────────────────────────────────── */
.footer {
  padding: 40px 0 32px;
  border-top: 1px solid var(--border);
  font-size: 11.5px;
  color: var(--text-3);
  line-height: 1.6;
}
.footer p { margin: 0 0 10px; }
.footer .legal { max-width: 80ch; margin: 0 auto; text-align: center; }
.footer a { color: var(--text-2); text-decoration: underline; }

/* ─── inline hero opt-in form ────────────────────────────────────────── */
.hero-form {
  width: 100%;
  max-width: 560px;
  margin: 4px auto 0;
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* Register banner (red urgency, clickable to focus first input) */
.register-banner {
  appearance: none;
  border: 0;
  width: 100%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding: 18px 22px;
  border-radius: 999px;
  background: linear-gradient(180deg, #ef4f3f 0%, #d62b1a 100%);
  color: #ffffff;
  font-family: var(--sans);
  font-size: clamp(24px, 2.2vw, 26px);
  font-weight: 600;
  letter-spacing: -0.01em;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.28),
    inset 0 -2px 0 rgba(0, 0, 0, 0.14),
    0 14px 40px -10px rgba(214, 43, 26, 0.45);
  margin-bottom: 4px;
  transition: transform 0.12s ease, filter 0.2s ease, box-shadow 0.2s ease;
}
.register-banner:hover {
  transform: translateY(-1px);
  filter: brightness(1.05);
}
.register-banner:active { transform: translateY(0); }
.register-banner .reg-arrow {
  font-size: 22px;
  font-weight: 600;
  opacity: 0.85;
  animation: regBounce 1.4s ease-in-out infinite;
}
.register-banner .reg-arrow:last-child { animation-delay: 0.2s; }
.register-banner .reg-text {
  display: flex;
  flex-direction: column;
  align-items: center;
  line-height: 1.1;
}
.register-banner .reg-text strong { font-weight: 700; font-size: clamp(24px, 2.2vw, 26px); }
.register-banner .reg-sub { font-size: clamp(14px, 1.5vw, 15px); opacity: 0.92; font-weight: 500; margin-top: 3px; }
@keyframes regBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(3px); }
}

/* Stacked input fields */
.hero-form-fields {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.hero-input {
  appearance: none;
  width: 100%;
  background: var(--bg-0);
  border: 1px solid var(--border-strong);
  border-radius: 12px;
  padding: 18px 20px;
  color: var(--text-0);
  font-family: var(--sans);
  font-size: 16px;
  outline: none;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
  box-shadow: 0 1px 2px rgba(20, 16, 8, 0.03);
}
.hero-input::placeholder { color: var(--text-3); }
.hero-input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
}

/* Mega submit button (matching red, with sub-line) */
.cta-mega {
  appearance: none;
  border: 0;
  width: 100%;
  padding: 20px 24px;
  border-radius: 14px;
  background: linear-gradient(180deg, #ef4f3f 0%, #d62b1a 100%);
  color: #ffffff;
  font-family: var(--sans);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.28),
    inset 0 -2px 0 rgba(0, 0, 0, 0.18),
    0 14px 36px -10px rgba(214, 43, 26, 0.5),
    0 0 0 1px rgba(184, 28, 18, 0.6);
  transition: transform 0.12s ease, filter 0.2s ease, box-shadow 0.2s ease;
  margin-top: 4px;
}
.cta-mega:hover:not(:disabled) {
  transform: translateY(-1px);
  filter: brightness(1.05);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.28),
    inset 0 -2px 0 rgba(0, 0, 0, 0.18),
    0 18px 50px -12px rgba(214, 43, 26, 0.6),
    0 0 0 1px rgba(184, 28, 18, 0.7);
}
.cta-mega:active:not(:disabled) { transform: translateY(0); }
.cta-mega:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  filter: grayscale(0.25);
}
.cta-mega-main {
  font-size: clamp(26px, 2.4vw, 28px);
  font-weight: 700;
  letter-spacing: -0.01em;
  display: inline-flex;
  align-items: center;
  gap: 12px;
  line-height: 1.1;
}
.cta-mega-sub {
  font-size: clamp(15px, 1.5vw, 16px);
  font-weight: 500;
  opacity: 0.92;
  letter-spacing: 0.01em;
  font-variant-numeric: tabular-nums;
}

/* Trust strip — avatars + count */
.trust-strip {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-top: 6px;
}
.avatars {
  display: inline-flex;
  align-items: center;
}

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

  );
  // deck-stage enables its rail in connectedCallback, but this panel can
  // mount before that element has upgraded. The initial read catches the
  // common case; the listener covers mounting first. (Older deck-stage.js
  // copies still wait for the host's __omelette_rail_enabled postMessage —
  // same listener handles those.)
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>
<script type="text/babel" data-source="proof-chart.jsx">
// proof-chart.jsx
// Stylized brokerage-account chart showing $5K → $493K trajectory.
// Pure SVG, no external assets. Hand-tuned curve mimicking the actual
// "Account showing $5,000 turned into $492,549" screenshot vibe.

function ProofChart() {
  // Account value points over ~60 trading days
  // shaped to look like volatile but explosively up
  const points = [

    [60, 415000], [63, 492549]

  const W = 540, H = 280;
  const padL = 56, padR = 16, padT = 24, padB = 36;
  const innerW = W - padL - padR;
  const innerH = H - padT - padB;

  const maxX = 63;
  const maxY = 500000;

  const xScale = (x) => padL + (x / maxX) * innerW;
  const yScale = (y) => padT + innerH - (y / maxY) * innerH;

  const pathD = points
    .map((p, i) => `${i === 0 ? "M" : "L"} ${xScale(p[0]).toFixed(1)} ${yScale(p[1]).toFixed(1)}`)
    .join(" ");

  const areaD = pathD + ` L ${xScale(points[points.length - 1][0]).toFixed(1)} ${yScale(0).toFixed(1)} L ${xScale(0).toFixed(1)} ${yScale(0).toFixed(1)} Z`;

  const yTicks = [0, 100000, 200000, 300000, 400000, 500000];
  const fmtY = (v) => v === 0 ? "$0" : `${(v / 1000)}K`;

  const lastPoint = points[points.length - 1];

  return (
    <div style={{ position: "relative" }}>

            letterSpacing: "0.16em",

            marginBottom: 4,

            Account Balance

          <div style={{
            fontFamily: "var(--mono)",
            fontWeight: 700,
            fontSize: 28,
            color: "var(--text-0)",
            letterSpacing: "-0.02em",
            fontVariantNumeric: "tabular-nums",
            lineHeight: 1,
          }}>
            $492,549.<span style={{ color: "var(--text-2)" }}>17</span>
          </div>
        </div>
        <div style={{ textAlign: "right" }}>
          <div style={{
            fontSize: 10,
            letterSpacing: "0.16em",
            textTransform: "uppercase",
            color: "var(--text-2)",
            fontWeight: 600,
            marginBottom: 4,
          }}>
            60-Day Return
          </div>
          <div style={{
            display: "inline-flex",
            alignItems: "center",
            gap: 6,
            color: "var(--green)",
            fontFamily: "var(--mono)",
            fontWeight: 700,
            fontSize: 18,
            fontVariantNumeric: "tabular-nums",
          }}>
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
              <path d="M5 1 L9 8 L1 8 Z" fill="currentColor" />
            </svg>
            +9,750.98%
          </div>
        </div>
      </div>

      <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{ display: "block" }}>
        <defs>
          <linearGradient id="areaG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#16a34a" stopOpacity="0.28" />
            <stop offset="100%" stopColor="#16a34a" stopOpacity="0" />
          </linearGradient>
          <linearGradient id="lineG" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stopColor="#16a34a" />
            <stop offset="100%" stopColor="#137a3a" />
          </linearGradient>
          <filter id="glow">
            <feGaussianBlur stdDeviation="1.5" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>

        {/* horizontal grid lines */}
        {yTicks.map((y, i) => (
          <g key={i}>

            fontFamily="var(--mono)"
            textAnchor="middle"

            Day {d}
          </text>
        ))}

        {/* area fill */}
        <path d={areaD} fill="url(#areaG)" />

        {/* main line */}
        <path
          d={pathD}
          fill="none"
          stroke="url(#lineG)"
          strokeWidth="2"
          strokeLinejoin="round"
          strokeLinecap="round"
          filter="url(#glow)"

        {/* starting marker */}

        />
        <circle
          cx={xScale(lastPoint[0])} cy={yScale(lastPoint[1])}
          r="9" fill="none" stroke="#137a3a" strokeOpacity="0.35" strokeWidth="1"
        />
      </svg>

      <div style={{
        display: "flex",
        justifyContent: "space-between",
        alignItems: "center",
        marginTop: 12,
        paddingTop: 12,
        borderTop: "1px solid var(--border)",
        fontSize: 11,
        color: "var(--text-2)",

      }}>
        <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>
          <span style={{
            width: 8, height: 8, borderRadius: "50%",
            background: "var(--green)", boxShadow: "0 0 6px rgba(19,122,58,0.45)",
          }} />
          Verified brokerage account
        </span>
        <span style={{ fontFamily: "var(--mono)", color: "var(--text-3)" }}>
          MAR 12 — MAY 11
        </span>
      </div>
    </div>
  );
}

Object.assign(window, { ProofChart });

</script>

      { label: "Several hours per day", sub: "Active trader" },
      { label: "Full-time", sub: "It's my career" },
    ],
  },
};

function OptInModal({ open, onClose, qualifierKey = "account_size", trainingDate, presenterName }) {
  const [step, setStep] = React.useState(1);
  const [answer, setAnswer] = React.useState(null);
  const [form, setForm] = React.useState({ first: "", email: "", phone: "" });
  const [submitting, setSubmitting] = React.useState(false);
  const [submitted, setSubmitted] = React.useState(false);

  // reset state when reopened
  React.useEffect(() => {
    if (open) {
      setStep(1);
      setAnswer(null);
      setForm({ first: "", email: "", phone: "" });
      setSubmitting(false);
      setSubmitted(false);
    }
  }, [open]);

  // lock body scroll
  React.useEffect(() => {
    if (open) {
      const prev = document.body.style.overflow;
      document.body.style.overflow = "hidden";
      return () => { document.body.style.overflow = prev; };
    }
  }, [open]);

  // esc to close

// Webinar: next upcoming Wednesday at 20:00 America/New_York.
// Recomputed on every render so once the current Wednesday's 8PM passes,

function getNextWebinar() {
  const now = Date.now();
  for (let i = 0; i <= 7; i++) {
    const probe = new Date(now + i * 86400000);
    const weekday = probe.toLocaleString("en-US", {
      timeZone: "America/New_York",
      weekday: "short"
    });
    if (weekday !== "Wed") continue;

    // Get the Y-M-D of this probe in NY tz (ISO-ish via sv-SE locale).
    const ymd = probe.toLocaleString("sv-SE", { timeZone: "America/New_York" }).slice(0, 10);
    const [y, m, d] = ymd.split("-").map(Number);

    // Detect whether NY is on EDT (UTC-4) or EST (UTC-5) for that date.
    const probeUtc = new Date(Date.UTC(y, m - 1, d, 20, 0, 0));
    const tzShort = probeUtc.toLocaleString("en-US", {
      timeZone: "America/New_York",
      timeZoneName: "short"
    });
    const offsetHours = /EDT/.test(tzShort) ? 4 : 5;
    const targetMs = Date.UTC(y, m - 1, d, 20 + offsetHours, 0, 0);

    if (targetMs > now) {
      const target = new Date(targetMs);
      return {
        date: target,
        short: target.toLocaleDateString("en-US", {
          timeZone: "America/New_York",
          weekday: "short",
          month: "short",
          day: "numeric"
        }),
        full: target.toLocaleDateString("en-US", {
          timeZone: "America/New_York",
          weekday: "long",
          month: "long",
          day: "numeric",
          year: "numeric"
        })
      };
    }
  }
  // Fallback (should never hit) — 7 days from now at 20:00 local.
  const fallback = new Date(now + 7 * 86400000);
  fallback.setHours(20, 0, 0, 0);
  return { date: fallback, short: "Soon", full: "Coming soon" };
}

/* ─── countdown hook ────────────────────────────────────────────────── */
function useCountdown(target) {
  const [now, setNow] = React.useState(() => new Date());
  React.useEffect(() => {
    const id = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(id);
  }, []);
  const diff = Math.max(0, target - now);
  const days = Math.floor(diff / 86400000);
  const hours = Math.floor(diff % 86400000 / 3600000);
  const mins = Math.floor(diff % 3600000 / 60000);
  const secs = Math.floor(diff % 60000 / 1000);
  return { days, hours, mins, secs };
}

const pad = (n) => String(n).padStart(2, "0");

/* ─── seat counter — slowly ticks ───────────────────────────────────── */
function useSeats(total = 1000, startFilled = 947) {
  const [filled, setFilled] = React.useState(startFilled);
  React.useEffect(() => {
    const id = setInterval(() => {
      setFilled((f) => {
        if (f >= total - 7) return f;
        return Math.random() < 0.4 ? f + 1 : f;
      });
    }, 6000);
    return () => clearInterval(id);
  }, [total]);
  return { filled, total, remaining: total - filled, pct: filled / total * 100 };
}

            <a href="https://www.millionairepub.com/privacy-policy/" target="_blank" rel="noopener">Privacy</a> · <a href="https://www.millionairepub.com/terms-of-service/" target="_blank" rel="noopener">Terms</a> · <a href="#">Disclosures</a>
          </p>
        </div>
      </footer>

      {/* ═══ modal ═══ */}
      <OptInModal
        open={modalOpen}
        onClose={() => setModalOpen(false)}
        qualifierKey={t.qualifier}
        trainingDate={`${webinar.full} • 8:00 PM EST`}
        presenterName={presenterName} />
      

      {/* ═══ tweaks panel ═══ */}
      <TweaksPanel>
        <TweakSection label="Headline" />
        <TweakSelect
          label="Variant"
          value={t.headline}
          options={[
          { value: "hiding-in-plain-sight", label: "Setup hiding in plain sight" },
          { value: "five-to-493", label: "$5K → $493K in 60 days" },
          { value: "one-strategy", label: "Learn one strategy this year" }]
          }
          onChange={(v) => setTweak("headline", v)} />
        

        <TweakSection label="Call to action" />
        <TweakSelect
          label="Button copy"
          value={t.ctaCopy}
          options={[
          { value: "save-seat", label: "Save My Seat" },
          { value: "i-want-in", label: "I Want In — Reserve My Spot" },
          { value: "yes-show", label: "Yes! Show Me The System" }]
          }
          onChange={(v) => setTweak("ctaCopy", v)} />
        
        <TweakColor
          label="Button shade"
          value={CTA_THEMES[t.ctaTheme]["--cta-grad-to"]}
          options={["#1d4ed8", "#0284c7", "#1e3a8a"]}
          onChange={(v) => {
            const map = { "#1d4ed8": "royal", "#0284c7": "electric", "#1e3a8a": "navy" };
            setTweak("ctaTheme", map[v] || "royal");
          }} />
        

        <TweakSection label="Urgency" />
        <TweakRadio
          label="Show"
          value={t.urgency}
          options={[
          { value: "both", label: "Both" },
          { value: "countdown", label: "Timer" },
          { value: "seats", label: "Seats" }]
          }
          onChange={(v) => setTweak("urgency", v)} />
        

        <TweakSection label="Qualifier (Step 1)" />
        <TweakSelect
          label="Question"
          value={t.qualifier}
          options={[
          { value: "account_size", label: "Account size" },
          { value: "experience", label: "Trading experience" },
          { value: "time", label: "Time commitment" }]
          }
          onChange={(v) => setTweak("qualifier", v)} />
        

        <TweakSection label="Presenter" />
        <TweakToggle
          label="Named presenter"
          value={t.namedPresenter}
          onChange={(v) => setTweak("namedPresenter", v)} />
        

        <TweakSection label="Background" />
        <TweakRadio
          label="Theme"
          value={t.bgTheme}
          options={[
          { value: "white", label: "White" },
          { value: "cream", label: "Cream" }]
          }
          onChange={(v) => setTweak("bgTheme", v)} />
        

        <TweakSection label="Quick test" />
        <TweakButton label="Open opt-in modal" onClick={openModal}>
          Show modal
        </TweakButton>
      </TweaksPanel>
    </div>);

}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
